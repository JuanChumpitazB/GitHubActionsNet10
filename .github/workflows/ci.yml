
name: CI - GitHubActionsNet10

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    env:
        APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT }}
      
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar solucion
        run: dotnet build --configuration Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test --configuration Release --no-build
        
      - name: Verificar variable y secret
        shell: bash
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          echo "Entorno configurado: $APP_ENVIRONMENT"

          if [ -z "$DEMO_API_TOKEN" ]; then
            echo "::error::El secret DEMO_API_TOKEN no esta configurado."
            exit 1
          fi

          echo "Secret de prueba configurado correctamente. Valor oculto."
          
         
      #- name: Simular fallo controlado
      #  run: |
      #    echo "Iniciando prueba de troubleshooting..."
      #    echo "Simulando un error intencional."
      #    exit 1

  publish:
    name: Publish API
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Publicar API
        run: dotnet publish ./GitHubActionsNet10.Api/GitHubActionsNet10.Api.csproj --configuration Release --no-restore --output ./publish

      - name: Subir artifact de publicacion
        uses: actions/upload-artifact@v7
        with:
          name: GitHubActionsNet10-API
          path: ./publish/
          if-no-files-found: error
